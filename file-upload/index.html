<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload</title>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #cbd5e1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .upload-container {
        background: var(--card-bg);
        padding: 32px;
        border-radius: 16px;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 8px;
        font-weight: 600;
      }

      p {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 24px;
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 32px 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #fdfdfd;
        position: relative;
        margin-bottom: 24px;
      }

      .drop-zone:hover {
        border-color: var(--primary);
        background: #f5f3ff;
      }

      .upload-icon {
        width: 48px;
        height: 48px;
        background: #e0e7ff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px auto;
        color: var(--primary);
        font-size: 24px;
        font-weight: bold;
      }

      .drop-zone-text {
        font-size: 0.95rem;
        color: var(--text);
        font-weight: 500;
      }

      .drop-zone input[type="file"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .file-name-preview {
        margin-top: 8px;
        font-size: 0.85rem;
        color: var(--primary);
        word-break: break-all;
        font-weight: 500;
      }

      button {
        width: 100%;
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="upload-container">
      <h2>Upload File</h2>
      <p>Select a document or image to upload</p>

      <form
        action="http://localhost:3000/profile"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="drop-zone">
          <div class="upload-icon">↑</div>
          <div class="drop-zone-text">Click or drag file here</div>
          <input type="file" name="file_input" id="file-input" required />
          <div class="file-name-preview" id="file-name">No file selected</div>
        </div>

        <button type="submit">Upload Now</button>
      </form>
    </div>

    <script>
      const fileInput = document.getElementById("file-input");
      const fileNameDiv = document.getElementById("file-name");

      fileInput.addEventListener("change", (e) => {
        const name = e.target.files[0]?.name;
        fileNameDiv.textContent = name
          ? `Selected: ${name}`
          : "No file selected";
      });
    </script>
  </body>
</html>
