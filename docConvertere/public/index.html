<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCX to PDF Converter</title>
    <style>
      :root {
        --primary-color: rgb(75, 18, 27);
        --primary-hover: rgb(105, 28, 39);
        --bg-color: #f4f6f9;
        --card-bg: #ffffff;
        --text-main: #333333;
        --border-color: #e0e0e0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .converter-container {
        background-color: var(--card-bg);
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        width: 380px;
        text-align: center;
        transition: transform 0.2s ease;
      }

      .converter-container:hover {
        transform: translateY(-2px);
      }

      h1 {
        color: var(--primary-color);
        margin: 0 0 8px 0;
        font-size: 28px;
        font-weight: 700;
      }

      p.subtitle {
        color: #666;
        margin: 0 0 30px 0;
        font-size: 14px;
      }

      .file-drop-area {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 35px 20px;
        border: 2px dashed #b5b5b5;
        border-radius: 8px;
        background-color: #fafafa;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
        margin-bottom: 25px;
      }

      .file-drop-area:hover,
      .file-drop-area.dragover {
        background-color: #f0edf0;
        border-color: var(--primary-color);
      }

      .file-drop-area input[type="file"] {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      .upload-icon {
        font-size: 40px;
        color: var(--primary-color);
        margin-bottom: 10px;
      }

      .file-msg {
        font-size: 14px;
        color: #555;
        font-weight: 500;
        word-break: break-all;
      }

      input[type="submit"] {
        background-color: var(--primary-color);
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        transition:
          background-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input[type="submit"]:hover {
        background-color: var(--primary-hover);
        box-shadow: 0 4px 12px rgba(75, 18, 27, 0.2);
      }

      input[type="submit"]:active {
        transform: scale(0.98);
      }
    </style>
  </head>

  <body>
    <div class="converter-container">
      <h1>Document Converter</h1>
      <p class="subtitle">Convert your DOCX files to PDF instantly</p>

      <form
        action="/docxtopdf"
        method="post"
        enctype="multipart/form-data"
        id="uploadForm"
      >
        <div class="file-drop-area" id="dropArea">
          <svg
            class="upload-icon"
            xmlns="http://www.w3.org/2000/svg"
            height="48px"
            viewBox="0 -960 960 960"
            width="48px"
            fill="currentColor"
          >
            <path
              d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-560v-160H240v640h480v-480H520ZM240-800v160-160 640-640Z"
            />
          </svg>
          <span class="file-msg" id="fileMsg"
            >Drag & drop or click to browse</span
          >
          <input
            type="file"
            name="file"
            id="fileInput"
            accept=".docx"
            required
          />
        </div>

        <input type="submit" value="Convert & Download PDF" />
      </form>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const fileMsg = document.getElementById("fileMsg");
      const dropArea = document.getElementById("dropArea");

      fileInput.addEventListener("change", (e) => {
        if (fileInput.files.length > 0) {
          fileMsg.textContent = fileInput.files[0].name;
          fileMsg.style.color = "rgb(75, 18, 27)";
        } else {
          fileMsg.textContent = "Drag & drop or click to browse";
        }
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        dropArea.addEventListener(
          eventName,
          () => dropArea.classList.add("dragover"),
          false,
        );
      });
      ["dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(
          eventName,
          () => dropArea.classList.remove("dragover"),
          false,
        );
      });
    </script>
  </body>
</html>
